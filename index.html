<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheris - In-Game Stage Renderer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cenário do Jogo (Stage) -->
  <div class="game-stage" id="viewport">
    
    <!-- Efeitos de Ambiente / Dungeon Lighting -->
    <div class="ambient-light"></div>
    <div class="torch-light"></div>

    <!-- Entidade do Personagem -->
    <div class="character-entity" id="player-container">
      
      <!-- Círculo Mágico / Runa no Chão -->
      <div class="rune-circle"></div>

      <!-- Sombra Projetada no Chão -->
      <div class="floor-shadow"></div>

      <!-- Efeito de Rastro / After-Image (Fantasma) -->
      <div id="player-ghost" class="sprite-layer ghost-effect"></div>

      <!-- Sprite Principal do Personagem -->
      <div id="player-sprite" class="sprite-layer main-character"></div>
      
    </div>

  </div>

  <!-- Barra de Controle In-Game / HUD -->
  <div class="hud-controls">
    <div class="hud-group">
      <label>Ângulo / Linha:</label>
      <select id="select-dir">
        <option value="0">0° - Frontal / Sul</option>
        <option value="1">45° - Sudoeste</option>
        <option value="2">90° - Oeste</option>
        <option value="3">135° - Noroeste</option>
        <option value="4">180° - Norte</option>
        <option value="5">225° - Nordeste</option>
        <option value="6">270° - Leste</option>
        <option value="7">315° - Sudeste</option>
      </select>
    </div>

    <div class="hud-group">
      <label>Escala (Tamanho):</label>
      <input type="range" id="scale-slider" min="2" max="6" step="0.5" value="4">
      <span id="scale-value">4x</span>
    </div>

    <div class="hud-group">
      <label>Velocidade (FPS):</label>
      <input type="range" id="fps-slider" min="8" max="60" value="24">
      <span id="fps-value">24 FPS</span>
    </div>

    <div class="hud-buttons">
      <button id="btn-toggle-aura">Alternar Aura</button>
      <button id="btn-toggle-ghost">Alternar Rastro</button>
      <button id="btn-play-pause">Pausar</button>
    </div>
  </div>

  <script src="SpriteAnimator.js"></script>
  <script src="main.js"></script>
</body>
</html>
